# Point SSH_AUTH_SOCK at the systemd-managed OpenSSH ssh-agent socket.
# (OpenSSH's own agent — not gnome-keyring's — so FIDO2/sk resident keys and
#  `ssh-add -K` work.) Read by the systemd user session at login via uwsm.
#
# One-time per machine, enable the agent:
#   systemctl --user enable --now ssh-agent.socket
SSH_AUTH_SOCK=${XDG_RUNTIME_DIR}/ssh-agent.socket

# Make YubiKey touch requests visible. Without an askpass, OpenSSH's
# "Confirm user presence" notification silently fails to exec and the only cue
# is the LED on the key itself — a missed touch then reports as "incorrect
# passphrase supplied to decrypt private key", which sends you chasing the
# wrong bug entirely. ssh-agent runs as a systemd user service, so it reads
# SSH_ASKPASS from here.
#
# SSH_ASKPASS_REQUIRE is intentionally left unset: forcing it would send real
# passphrase prompts to the shim, which only notifies and cannot collect input.
SSH_ASKPASS=${HOME}/.local/bin/ssh-askpass-notify
