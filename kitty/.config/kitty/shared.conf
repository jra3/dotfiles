# Kitty — shared across hosts. Stowed from ~/.dotfiles/kitty and included LAST by
# the host-local ~/.config/kitty/kitty.conf; kitty applies later lines over
# earlier ones, so anything set here wins over that file. Keep font_size out of
# here: it is per-display and `omarchy display text size` writes it into
# kitty.conf with sed -i. See README.md in the package.

# Dynamic theme colors (rewritten by `omarchy theme set`, applied via SIGUSR1)
include ~/.local/state/omarchy/current/theme/kitty.conf

# Font — family only; size lives in the host-local kitty.conf. Pinning the family
# here means `omarchy font set` (which seds ^font_family in kitty.conf) no longer
# reaches kitty — same trade-off as the ghostty package.
font_family CaskaydiaMono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto

# Window
window_padding_width 14
hide_window_decorations yes
# Threshold, not a toggle: it counts kitty windows in what is being closed. With
# no splits every tab is one window, so 2 means ctrl+shift+q (close_os_window)
# prompts only when a second tab exists, and ctrl+shift+w (close_tab, one
# window) never prompts. Omarchy ships 0 (never ask).
confirm_os_window_close 2
# Ghostty's default scrollback is ~10 MB; kitty's is 2000 lines. Only matters
# outside tmux/herdr, which keep their own.
scrollback_lines 10000

# Cursor
cursor_shape block
cursor_blink_interval 0
shell_integration no-cursor
enable_audio_bell no

# Scrolling. Ghostty ran mouse-scroll-multiplier 0.95 on its default 3 lines per
# wheel notch. Omarchy also gives kitty windows scroll_touchpad = 1.5 in Hyprland
# ($OMARCHY_PATH/default/hypr/input.lua), which ghostty never got, so 0.65 here
# lands touchpad scrolling back near ghostty's feel (1.5 * 0.65 ~ 0.98).
wheel_scroll_multiplier 3.0
touch_scroll_multiplier 0.65

# Remote control — omarchy-cmd-terminal-cwd reads the focused window's cwd over
# this socket so SUPER+ENTER opens the new terminal where the old one was.
allow_remote_control yes
listen_on unix:${XDG_RUNTIME_DIR}/omarchy-kitty-{kitty_pid}

# Tab bar. Omarchy's default puts it at the bottom; ghostty's GTK tabs sat on
# top, so keep that. Hidden until there is a second tab (tab_bar_min_tabs).
tab_bar_edge                top
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

# Inactive tabs. Kitty's defaults are #444 on #999 -- 3.4:1, under the 4.5:1 AA
# floor, which is why an inactive title is hard to read. These are Tokyo Night's
# selection_background and foreground: 6.4:1. They are literal values, so the
# theme include at the top no longer drives them and `omarchy theme set` leaves
# them behind -- the same trade-off as font_family above. The theme still owns
# active_tab_background, the one tab key its template writes.
# ~/.config/omarchy/themed/kitty.conf.tpl would keep theme tracking, at the cost
# of living outside this repo.
inactive_tab_background     #292e42
inactive_tab_foreground     #a9b1d6

# Per-tab colours driven by what is running in the tab -- herdr goes red. The
# path is resolved against the kitty config dir, so it lands on the tab_colors.py
# stowed next to this file. Watchers attach at window creation, so SIGUSR1 alone
# does not retrofit a rule change onto existing tabs: open a new one to see it.
watcher                     tab_colors.py

# Keybindings
map ctrl+insert copy_to_clipboard
map shift+insert paste_from_clipboard
# Shift+Enter as ESC+CR (newline in Claude Code, M-Enter in tmux). Omarchy ships
# `\e[13;2u` here instead; swap if you want the CSI-u encoding that lets TUIs
# tell Shift+Enter apart from Enter.
map shift+enter send_text all \x1b\r
# Legacy encoding sends Alt+Shift+Enter the same as Alt+Enter; send CSI-u so tmux can match M-S-Enter.
map alt+shift+enter send_text all \e[13;4u
# Delete sends ^D (carried over from the ghostty config).
map delete send_text all \x04

# macOS/Emacs-style word navigation
map alt+left   send_text all \x1bb
map alt+right  send_text all \x1bf
map ctrl+left  send_text all \x1bb
map ctrl+right send_text all \x1bf

# Tabs. Kitty already matches ghostty on ctrl+shift+t (new), ctrl+tab /
# ctrl+shift+tab and ctrl+shift+left/right (next/previous). Kitty's defaults
# have ctrl+shift+q close the tab and ctrl+shift+w close the (split) window;
# swapped here to the macOS shape: w closes the tab, q closes the whole OS
# window with every tab in it; confirm_os_window_close 2 makes that prompt only
# when another tab exists.
map ctrl+shift+w close_tab
map ctrl+shift+q close_os_window
# The rest are the ghostty defaults kitty lacks. goto_tab past the last tab lands
# on the last tab (tabs.py goto_tab clamps to len(tabs)-1), so ctrl+shift+9 acts
# like ghostty's last_tab.
#
# These were on alt+1..9 until 2026-09-08. kitty dispatches its own shortcuts
# before the key reaches the app, so alt+N was eaten in every context — including
# after herdr's prefix — which left herdr's focus_agent = "prefix+alt+1..9" dead.
# ctrl+shift+1..9 was kitty's first_window..ninth_window, unused once splits went
# away, so tabs moved onto it and alt+N went back to herdr. These lines also
# unbind first_window..ninth_window: for one key kitty runs the LAST matching map
# (keys.py matching_key_actions), so nothing more is needed below.
map ctrl+page_up   previous_tab
map ctrl+page_down next_tab
map ctrl+shift+1 goto_tab 1
map ctrl+shift+2 goto_tab 2
map ctrl+shift+3 goto_tab 3
map ctrl+shift+4 goto_tab 4
map ctrl+shift+5 goto_tab 5
map ctrl+shift+6 goto_tab 6
map ctrl+shift+7 goto_tab 7
map ctrl+shift+8 goto_tab 8
map ctrl+shift+9 goto_tab 9

# Splits — kitty calls them "windows" — are unused. herdr owns layout, and every
# herdr tab here holds exactly one pane too, so kitty's whole window group is
# unbound: an unused split key is only a way to wreck a layout by accident.
# `no_op` clears the mapping and lets the key through to the app (options/utils.py
# rewrites no_op to an empty definition, and keys.py only consumes a key whose
# definition actually runs). Comments must stay on their own lines here — for a
# `map` line kitty takes the rest of the line as the action.
# ctrl+shift+w is the group's other default (close_window); it already went to
# close_tab above.
# new_window
map ctrl+shift+enter no_op
# next_window / previous_window
map ctrl+shift+] no_op
map ctrl+shift+[ no_op
# move_window_forward / move_window_backward / move_window_to_top
map ctrl+shift+f no_op
map ctrl+shift+b no_op
map ctrl+shift+` no_op
# start_resizing_window
map ctrl+shift+r no_op
# next_layout (layouts only exist to arrange splits)
map ctrl+shift+l no_op
# focus_visible_window / swap_with_window
map ctrl+shift+f7 no_op
map ctrl+shift+f8 no_op
# tenth_window. first_window..ninth_window are handled in the Tabs section above,
# which reuses ctrl+shift+1..9 for goto_tab — do not add no_op lines for those
# here, they come later in the file and the last map for a key wins.
map ctrl+shift+0 no_op
# ctrl+shift+escape opens the kitty debug shell, and its default target is a split.
# Keep the feature, drop the split: `overlay` covers the active window instead.
map ctrl+shift+escape kitty_shell overlay
